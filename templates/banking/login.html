{% extends "base.html" %}{% block title %}Login | SecureBank{% endblock %}
{% block content %}
<div class="auth-card card shadow-sm mx-auto p-4">
<h2 class="h4 mb-3">Customer login</h2>
<form method="post">{% csrf_token %}
  {% if form.errors %}<div class="alert alert-danger">Invalid username or password.</div>{% endif %}
  <div class="mb-3"><label class="form-label">Username</label>{{ form.username }}</div>
  <div class="mb-3"><label class="form-label">Password</label>{{ form.password }}</div>
  <button class="btn btn-primary w-100">Login</button>
</form>
<p class="mt-3 mb-0">New customer? <a href="{% url 'register' %}">Create a demo account</a></p>
</div>
{% endblock %}
